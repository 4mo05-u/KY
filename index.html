<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPhone Lock Screen</title>
    <style>
      :root {
        --bg: #000000;
        --panel: rgba(255,255,255,0.08);
        --panel-strong: rgba(255,255,255,0.12);
        --text: #f5f5f5;
        --muted: rgba(255,255,255,0.75);
        --glass: rgba(255,255,255,0.06);
        --shadow: rgba(0,0,0,0.4);
        --blue: #5fa9ff;
        --green: #7ed957;
        --yellow: #ffcb4d;
        --orange: #ff8a5c;
        --pink: #ff5ea8;
        --purple: #a792ff;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        align-items: stretch;
        background:
          radial-gradient(circle at 50% 15%, rgba(255,255,255,0.08), transparent 30%),
          #000;
      }

      .iphone-shell {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #000;
        overflow: hidden;
      }

      .screen {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* 잠금화면 */
      .lock-screen {
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 54px 28px 32px;
        background:
          linear-gradient(180deg, rgba(17,18,23,0.4), rgba(8,8,10,0.65)),
          radial-gradient(circle at 50% 25%, rgba(255,255,255,0.08), transparent 36%),
          #000;
        transition: opacity 0.45s ease, transform 0.5s ease, visibility 0.5s ease;
      }

      .lock-screen.hidden {
        opacity: 0;
        visibility: hidden;
        transform: scale(1.05);
        pointer-events: none;
      }

      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: rgba(255,255,255,0.92);
      }

      .status-icons {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .status-icons .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255,255,255,0.9);
      }

      .status-icons .bar {
        width: 18px;
        height: 9px;
        border-radius: 999px;
        border: 2px solid rgba(255,255,255,0.9);
        border-top: none;
        position: relative;
        overflow: hidden;
      }

      .status-icons .bar::after {
        content: "";
        position: absolute;
        left: 2px;
        right: 2px;
        top: 0;
        bottom: 2px;
        border-radius: 999px;
        background: rgba(255,255,255,0.9);
      }

      .lock-main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .time {
        font-size: clamp(4.1rem, 8vw, 6.5rem);
        font-weight: 300;
        letter-spacing: -0.08em;
        line-height: 1;
        margin-bottom: 16px;
      }

      .date {
        font-size: clamp(1rem, 2vw, 1.3rem);
        color: rgba(255,255,255,0.88);
        letter-spacing: 0.02em;
      }

      .unlock-hint {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        color: rgba(255,255,255,0.8);
        font-size: 0.95rem;
        letter-spacing: -0.02em;
        margin-top: auto;
        padding-bottom: 8px;
      }

      .unlock-hint .bar {
        width: 32px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255,255,255,0.3);
      }

      .unlock-hint .text {
        font-weight: 500;
      }

      .lock-screen-hitbox {
        position: absolute;
        inset: 0;
        z-index: 5;
        cursor: pointer;
      }

      /* 홈화면 */
      .home-screen {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: #000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }

      .home-screen.active {
        opacity: 1;
        visibility: visible;
      }

      .home-screen .top-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 18px 22px 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 15px;
        font-weight: 600;
        color: rgba(255,255,255,0.94);
      }

      .home-screen .widgets-area {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 130px;
        display: flex;
        justify-content: center;
        padding: 0 20px;
      }

      .widget-grid {
        width: min(100%, 430px);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .widget {
        min-height: 128px;
        border-radius: 26px;
        background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 10px 30px rgba(0,0,0,0.25);
        padding: 18px 16px 12px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .widget-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      .widget-icon {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 20px;
        color: white;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.26);
      }

      .msg .widget-icon { background: linear-gradient(135deg, #7fc4ff, #3a82ff); }
      .call .widget-icon { background: linear-gradient(135deg, #7eeb9c, #2bc471); }
      .kakao .widget-icon { background: linear-gradient(135deg, #ffd457, #f4c542); color: #2f1c00; }
      .insta .widget-icon { background: linear-gradient(135deg, #ff5f8a, #f7b64d 26%, #8b5cf6 60%, #52c7ff); }

      .widget-badge {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255,255,255,0.9);
      }

      .widget-label {
        font-size: 0.98rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: rgba(255,255,255,0.95);
      }

      .widget-small {
        font-size: 0.72rem;
        color: rgba(255,255,255,0.64);
      }

      .widget-compact {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .widget-mini {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(255,255,255,0.14);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .home-dock {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 18px;
        width: min(92vw, 420px);
        height: 86px;
        border-radius: 28px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 18px;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .dock-item {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .dock-dot {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05));
        border: 1px solid rgba(255,255,255,0.08);
        display: grid;
        place-items: center;
        font-size: 20px;
      }

      .dock-item:nth-child(1) .dock-dot { background: linear-gradient(180deg, #7fc4ff, #4789ff); }
      .dock-item:nth-child(2) .dock-dot { background: linear-gradient(180deg, #7ff0d9, #41c3a4); }
      .dock-item:nth-child(3) .dock-dot { background: linear-gradient(180deg, #ffd75c, #f1a500); }
      .dock-item:nth-child(4) .dock-dot { background: linear-gradient(180deg, #ff8fa7, #ff5c8d); }
      .dock-item:nth-child(5) .dock-dot { background: linear-gradient(180deg, #d6d6ff, #9b8ae9); }

      /* 데스크탑처럼 자연스럽게 약간의 배경 깊이 */
      .home-screen::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05), transparent 30%),
          linear-gradient(180deg, rgba(255,255,255,0.02), transparent 15%, rgba(255,255,255,0.01), transparent 100%);
      }

      @media (max-width: 420px) {
        .widget-grid {
          gap: 12px;
        }

        .widget {
          min-height: 118px;
        }
      }
    </style>
  </head>
  <body>
    <div class="iphone-shell">
      <div class="screen lock-screen" id="lockScreen">
        <div class="status-bar">
          <span id="lockTimeText">9:41</span>
          <div class="status-icons">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="bar"></span>
          </div>
        </div>

        <div class="lock-main">
          <div class="time" id="timeText">오후 7:45</div>
          <div class="date" id="dateText">2026년 10월 24일 토요일</div>
        </div>

        <div class="unlock-hint">
          <span class="bar"></span>
          <span class="text">화면을 터치하면 잠금이 해제됩니다</span>
        </div>

        <div class="lock-screen-hitbox" id="unlockButton" aria-label="잠금 해제"></div>
      </div>

      <div class="screen home-screen active" id="homeScreen">
        <div class="top-bar">
          <span id="homeTopTime">오후 7:45</span>
          <div class="status-icons">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="bar"></span>
          </div>
        </div>

        <div class="widgets-area">
          <div class="widget-grid">
            <div class="widget msg">
              <div class="widget-header">
                <div class="widget-icon">✉</div>
                <div class="widget-badge"></div>
              </div>
              <div class="widget-label">메세지</div>
              <div class="widget-small">24개</div>
            </div>

            <div class="widget call">
              <div class="widget-header">
                <div class="widget-icon">☎</div>
                <div class="widget-badge"></div>
              </div>
              <div class="widget-label">전화</div>
              <div class="widget-small">최근 통화</div>
            </div>

            <div class="widget kakao">
              <div class="widget-header">
                <div class="widget-icon">💬</div>
                <div class="widget-badge"></div>
              </div>
              <div class="widget-label">카카오톡</div>
              <div class="widget-small">5개 새 메시지</div>
            </div>

            <div class="widget insta">
              <div class="widget-header">
                <div class="widget-icon">◎</div>
                <div class="widget-badge"></div>
              </div>
              <div class="widget-label">인스타</div>
              <div class="widget-small">새 게시물</div>
            </div>
          </div>
        </div>

        <div class="home-dock">
          <div class="dock-item"><div class="dock-dot">☎</div></div>
          <div class="dock-item"><div class="dock-dot">💬</div></div>
          <div class="dock-item"><div class="dock-dot">◍</div></div>
          <div class="dock-item"><div class="dock-dot">◎</div></div>
          <div class="dock-item"><div class="dock-dot">⚙</div></div>
        </div>
      </div>
    </div>

    <script>
      const lockScreen = document.getElementById("lockScreen");
      const homeScreen = document.getElementById("homeScreen");
      const unlockButton = document.getElementById("unlockButton");

      function formatKoreanDate(date) {
        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        const day = date.getDate();
        const weekday = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"][date.getDay()];
        return `${year}년 ${month}월 ${day}일 ${weekday}`;
      }

      function formatTime(date) {
        const hours = date.getHours();
        const minutes = String(date.getMinutes()).padStart(2, "0");
        const isPM = hours >= 12;
        const displayHour = hours % 12 || 12;
        return `${isPM ? "오후" : "오전"} ${displayHour}:${minutes}`;
      }

      function updateClock() {
        const now = new Date();
        const timeText = formatTime(now);
        const dateText = formatKoreanDate(now);

        document.getElementById("timeText").textContent = timeText;
        document.getElementById("dateText").textContent = dateText;
        document.getElementById("homeTopTime").textContent = timeText;
        document.getElementById("lockTimeText").textContent = now.toLocaleTimeString("ko-KR", {
          hour: "numeric",
          minute: "2-digit",
          hour12: true
        }).replace(" ", "");
      }

      function unlock() {
        lockScreen.classList.add("hidden");
        homeScreen.classList.add("active");
      }

      unlockButton.addEventListener("pointerdown", unlock);
      unlockButton.addEventListener("click", unlock);

      updateClock();
      setInterval(updateClock, 60000);
    </script>
  </body>
</html>
