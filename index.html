<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Touch Unlock Home</title>
  <style>
    :root {
      --bg: #000000;
      --white: #ffffff;
      --text: rgba(255,255,255,0.95);
      --muted: rgba(255,255,255,0.72);
      --soft: rgba(255,255,255,0.08);
      --soft2: rgba(255,255,255,0.12);
      --glass: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.06);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overscroll-behavior: none;
    }

    .phone {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    .statusbar {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: rgba(255,255,255,0.95);
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .signal {
      display: inline-block;
      width: 18px;
      height: 10px;
      border: 1.5px solid rgba(255,255,255,0.85);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .signal::before {
      content: "";
      position: absolute;
      inset: 2px;
      background: rgba(255,255,255,0.9);
      border-radius: 1px;
    }

    .battery {
      position: relative;
      width: 24px;
      height: 12px;
      border: 1.5px solid rgba(255,255,255,0.85);
      border-radius: 3px;
      overflow: hidden;
    }

    .battery::before {
      content: "";
      position: absolute;
      inset: 2px;
      background: rgba(255,255,255,0.9);
      border-radius: 1px;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -3px;
      top: 2px;
      width: 2px;
      height: 6px;
      border-radius: 1px;
      background: rgba(255,255,255,0.8);
    }

    .lock-screen {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 12;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.85s ease, transform 0.85s ease, visibility 0.85s ease;
      cursor: pointer;
    }

    .lock-screen.hidden {
      opacity: 0;
      transform: translateY(-10px) scale(1.02);
      visibility: hidden;
      pointer-events: none;
    }

    .lock-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 84px 24px 32px;
      text-align: center;
    }

    .time {
      font-size: clamp(54px, 11vw, 82px);
      line-height: 1;
      font-weight: 300;
      letter-spacing: -4px;
      color: rgba(255,255,255,0.95);
    }

    .date {
      margin-top: 10px;
      font-size: clamp(14px, 2vw, 18px);
      color: rgba(255,255,255,0.8);
      letter-spacing: 0.2px;
      font-weight: 500;
    }

    .unlock-hint {
      margin-top: 10px;
      font-size: 17px;
      color: rgba(255,255,255,0.85);
      font-weight: 500;
      user-select: none;
    }

    .home-screen {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.75s ease, visibility 0.75s ease;
      z-index: 20;
    }

    .home-screen.active {
      opacity: 1;
      visibility: visible;
    }

    .home-topbar {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 20px;
      right: 20px;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(255,255,255,0.92);
      font-size: 12px;
      font-weight: 600;
    }

    .weather-box {
      position: absolute;
      top: 70px;
      left: 20px;
      right: 20px;
      padding: 18px 18px 14px;
      border-radius: 24px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 2;
    }

    .weather-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(255,255,255,0.9);
    }

    .weather-city {
      font-size: 12px;
      font-weight: 600;
      opacity: 0.8;
    }

    .weather-icon {
      font-size: 18px;
      opacity: 0.9;
    }

    .weather-main {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin-top: 12px;
    }

    .weather-temp {
      font-size: 42px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: -2px;
    }

    .weather-desc {
      font-size: 12px;
      color: rgba(255,255,255,0.75);
      padding-bottom: 8px;
    }

    .weather-detail {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11.5px;
      color: rgba(255,255,255,0.72);
    }

    .home-date {
      position: absolute;
      top: 224px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 22px;
      color: rgba(255,255,255,0.9);
      z-index: 2;
    }

    .notifications {
      position: absolute;
      top: 262px;
      left: 18px;
      right: 18px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .notice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.04);
    }

    .notice-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .notice-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 14px;
      background: rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    .notice-title {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .notice-sub {
      font-size: 10.5px;
      color: rgba(255,255,255,0.68);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .notice-time {
      font-size: 10px;
      color: rgba(255,255,255,0.62);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .apps {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 392px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px 10px;
      z-index: 2;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(16px) scale(0.96);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .app-item.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .app {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 8px 14px rgba(0,0,0,0.18);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .app:active {
      transform: scale(0.96);
    }

    .app-icon {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      border-radius: 18px;
      font-size: 17px;
      font-weight: 700;
      color: rgba(255,255,255,0.96);
      overflow: hidden;
      position: relative;
    }

    .app-name {
      margin-top: 8px;
      font-size: 11px;
      color: rgba(255,255,255,0.88);
      text-align: center;
      white-space: nowrap;
    }

    .gradient-phone { background: linear-gradient(135deg, #91f2b8, #42d191 48%, #1f9f6d); }
    .gradient-message { background: linear-gradient(135deg, #ffcf7f, #ffac3f 52%, #e98b2b); }
    .gradient-line { background: linear-gradient(135deg, #86efaf, #22c55e 46%, #16a34a); }
    .gradient-insta { background: linear-gradient(135deg, #ffd166, #ff8a4c 26%, #e74c84 56%, #8b5cf6 80%, #4f46e5); }
    .gradient-blue { background: linear-gradient(135deg, #8bb8ff, #5a7dff 48%, #3a5fe0); }
    .gradient-gray { background: linear-gradient(135deg, #e5eaef, #adb8c5 54%, #7d8898); }
    .gradient-red { background: linear-gradient(135deg, #ffadb6, #ff7385 52%, #ef4658); }
    .gradient-sky { background: linear-gradient(135deg, #bfeaff, #7ecfff 52%, #46a7ff); }

    .dock {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 22px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      z-index: 2;
    }

    .dock .app {
      width: 56px;
      height: 56px;
      opacity: 1;
      transform: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: opacity 0.28s ease, transform 0.38s ease, visibility 0.28s ease;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .sheet {
      width: min(86vw, 340px);
      height: min(76vh, 620px);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      overflow: hidden;
      position: relative;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 14px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
    }

    .sheet-title {
      font-size: 16px;
      font-weight: 600;
      color: rgba(255,255,255,0.95);
    }

    .closeBtn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.9);
      font-size: 18px;
      cursor: pointer;
    }

    .sheet-body {
      height: calc(100% - 76px);
      overflow: auto;
      background: rgba(255,255,255,0.015);
    }

    .sheet-top {
      padding: 16px 18px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(255,255,255,0.84);
      font-weight: 700;
      font-size: 14px;
    }

    .searchBox {
      margin: 0 18px 12px 18px;
      height: 36px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      padding: 0 14px;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
    }

    .msg-list {
      list-style: none;
      padding: 0 10px 10px 10px;
      margin: 0;
    }

    .msg-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 8px;
      border-radius: 14px;
      transition: background 0.15s ease;
    }

    .msg-item:hover {
      background: rgba(255,255,255,0.03);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
      flex-shrink: 0;
    }

    .msg-meta {
      flex: 1;
      min-width: 0;
    }

    .msg-name {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255,255,255,0.95);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .msg-preview {
      margin-top: 3px;
      font-size: 11.5px;
      color: rgba(255,255,255,0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .msg-time {
      font-size: 10.5px;
      color: rgba(255,255,255,0.62);
      flex-shrink: 0;
      margin-left: 8px;
      white-space: nowrap;
    }

    .generic-sheet {
      padding: 26px 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      height: calc(100% - 76px);
    }

    .generic-icon {
      width: 90px;
      height: 90px;
      border-radius: 26px;
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: 700;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 12px 28px rgba(0,0,0,0.25);
    }

    .generic-name {
      font-size: 22px;
      font-weight: 700;
      color: rgba(255,255,255,0.96);
    }

    .generic-text {
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255,255,255,0.72);
      text-align: center;
      max-width: 220px;
    }

    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .badge {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.74);
      font-size: 11px;
    }

    @media (max-width: 420px) {
      .dock .app {
        width: 52px;
        height: 52px;
      }
      .app {
        width: 62px;
        height: 62px;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="lock-screen" id="lockScreen">
      <div class="statusbar">
        <span id="lockTimeText">9:41</span>
        <div class="status-icons">

    <div class="home-screen" id="homeScreen">

      <div class="weather-box">

        </div>

        <div class="notice">

      <div class="apps">

            <div class="app-icon gradient-blue">캘</div>

        </div>

        <div class="app-item" data-delay="400">
          <div class="app" data-app="지도">
            <div class="app-icon gradient-gray">맵</div>
          </div>

        </div>

        <div class="app-item" data-delay="480">
          <div class="app" data-app="설정">
            <div class="app-icon gradient-red">설</div>
          </div>

        <div class="app-item" data-delay="560">

      <div class="dock">

          <div class="app-icon gradient-message">💬</div>
        </div>
        <div class="app" data-app="LINE">
          <div class="app-icon gradient-line">L</div>

    <div class="overlay" id="overlay">
      <div class="sheet">
        <div class="sheet-header">
          <div class="sheet-title" id="sheetTitle">앱</div>
          <div class="closeBtn" id="closeBtn">×</div>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>
  </div>

  <script>
    const lockScreen = document.getElementById("lockScreen");
    const homeScreen = document.getElementById("homeScreen");
    const unlockHint = document.getElementById("unlockHint");
    const overlay = document.getElementById("overlay");
    const sheetBody = document.getElementById("sheetBody");
    const sheetTitle = document.getElementById("sheetTitle");
    const closeBtn = document.getElementById("closeBtn");

    function unlockPhone() {
      lockScreen.classList.add("hidden");
      homeScreen.classList.add("active");
      setTimeout(revealAppIcons, 160);
    }

    unlockHint.addEventListener("click", unlockPhone);
    unlockHint.addEventListener("touchstart", unlockPhone);
    lockScreen.addEventListener("click", unlockPhone);
    lockScreen.addEventListener("touchstart", unlockPhone);

    function profileSvg(color1, color2) {
      const svg = `
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
          <defs>
            <linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
              <stop offset='0%' stop-color='${color1}'/>
              <stop offset='100%' stop-color='${color2}'/>
            </linearGradient>
          </defs>
          <rect width='100' height='100' rx='50' fill='url(#g)'/>
          <circle cx='50' cy='38' r='17' fill='rgba(255,255,255,0.75)'/>
          <path d='M25 80c4-15 18-22 25-22s21 7 25 22' fill='rgba(255,255,255,0.78)'/>
        </svg>
      `;
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    const messageContacts = [
      { name: "엄마", preview: "알겠어요. 조만간 갈게요.", time: "월요일", avatar: profileSvg("#c8d6ff", "#8aa3df") },
      { name: "아빠", preview: "잘 지내고 있지?", time: "오전 8:15", avatar: profileSvg("#ffd9a8", "#f0aa55") },
      { name: "정민혁", preview: "내일 시간 괜찮아?", time: "어제", avatar: profileSvg("#d9f9d7", "#72c184") },
      { name: "마에다 리쿠", preview: "사진 보냈어!", time: "어제", avatar: profileSvg("#ffd0dc", "#ff86af") },
      { name: "010-0404-0606", preview: "휴대폰 문자 확인했어", time: "월", avatar: profileSvg("#d9d9ff", "#8a8af0") },
      { name: "1544-3211", preview: "고객센터 안내입니다.", time: "월", avatar: profileSvg("#d8f0ff", "#6bb3ea") }
    ];

    function updateClock() {
      const now = new Date();
      const timeFormatter = new Intl.DateTimeFormat("ko-KR", {
        timeZone: "Asia/Seoul",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
      const dateFormatter = new Intl.DateTimeFormat("ko-KR", {
        timeZone: "Asia/Seoul",
        weekday: "long",
        month: "long",
        day: "numeric"
      });
      const dateLongFormatter = new Intl.DateTimeFormat("ko-KR", {
        timeZone: "Asia/Seoul",
        month: "long",
        day: "numeric",
        weekday: "long"
      });

      const time = timeFormatter.format(now);
      document.getElementById("lockTimeText").textContent = time;
      document.getElementById("lockTime").textContent = time;
      document.getElementById("homeTime").textContent = time;

      document.getElementById("lockDate").textContent = dateFormatter.format(now);
      document.getElementById("homeDate").textContent = dateLongFormatter.format(now);
    }

    function showAppOverlay(appName) {
      const meta = {
        "전화": { icon: "☎", color: "gradient-phone", text: "사람들과 연결되는 가장 빠른 방법입니다." },
        "메시지": { icon: "💬", color: "gradient-message", text: "중요한 메시지를 바로 확인하세요." },
        "LINE": { icon: "L", color: "gradient-line", text: "대화와 소통을 편하게 이어가세요." },
        "Instagram": { icon: "◎", color: "gradient-insta", text: "사진과 순간을 기록해보세요." },
        "캘린더": { icon: "캘", color: "gradient-blue", text: "일정을 한눈에 관리해보세요." },
        "지도": { icon: "맵", color: "gradient-gray", text: "다음 목적지까지 가장 빠른 길을 찾습니다." },
        "설정": { icon: "설", color: "gradient-red", text: "기기 환경을 맞춤 설정해보세요." },
        "앱": { icon: "앱", color: "gradient-sky", text: "새로운 앱을 더 쉽게 찾아보세요." }
      };

      const data = meta[appName] || meta["앱"];
      sheetTitle.textContent = appName;
      sheetBody.innerHTML = `
        <div class="generic-sheet">
          <div class="generic-icon ${data.color}">${data.icon}</div>
          <div class="generic-name">${appName}</div>
          <div class="generic-text">${data.text}</div>
          <div class="badges">
            <span class="badge">실시간</span>
            <span class="badge">알림</span>
            <span class="badge">편리함</span>
          </div>
        </div>
      `;
      overlay.classList.add("show");
    }

    function showMessageList() {
      sheetTitle.textContent = "메시지";
      sheetBody.innerHTML = `
        <div class="sheet-top">
          <div>대화</div>
          <div>✎</div>
        </div>
        <div class="searchBox">검색</div>
        <ul class="msg-list">
          ${messageContacts.map(contact => `
            <li class="msg-item">
              <div class="avatar" style="background-image: url('${contact.avatar}');"></div>
              <div class="msg-meta">
                <div class="msg-name">${contact.name}</div>
                <div class="msg-preview">${contact.preview}</div>
              </div>
              <div class="msg-time">${contact.time}</div>
            </li>
          `).join("")}
        </ul>
      `;
      overlay.classList.add("show");
    }

    closeBtn.addEventListener("click", () => overlay.classList.remove("show"));
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) overlay.classList.remove("show");
    });

    function revealAppIcons() {
      const items = document.querySelectorAll(".app-item");
      items.forEach((item) => {
        const delay = Number(item.dataset.delay || 0);
        setTimeout(() => item.classList.add("visible"), delay);
      });
    }

    document.querySelectorAll(".app").forEach((app) => {
      app.addEventListener("click", () => {
        const appName = app.dataset.app || "앱";
        if (appName === "메시지") {
          showMessageList();
        } else {
          showAppOverlay(appName);
        }
      });
    });

    async function loadWeather() {
      try {
        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,relative_humidity_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&forecast_days=1");
        const data = await res.json();
        if (!data || !data.current) return;

        const temp = Math.round(data.current.temperature_2m);
        const humid = Math.round(data.current.relative_humidity_2m);
        const weatherCode = data.current.weather_code;
        const max = Math.round(data.daily.temperature_2m_max[0]);
        const min = Math.round(data.daily.temperature_2m_min[0]);

        const map = {
          0: { icon: "☀️", desc: "맑음" },
          1: { icon: "🌤️", desc: "대체로 맑음" },
          2: { icon: "⛅", desc: "부분적으로 흐림" },
          3: { icon: "☁️", desc: "흐림" },
          45: { icon: "🌫️", desc: "안개" },
          48: { icon: "🌫️", desc: "짙은 안개" },
          51: { icon: "🌦️", desc: "약한 이슬비" },
          53: { icon: "🌦️", desc: "이슬비" },
          55: { icon: "🌧️", desc: "강한 이슬비" },
          61: { icon: "🌧️", desc: "약한 비" },
          63: { icon: "🌧️", desc: "비" },
          65: { icon: "🌧️", desc: "강한 비" },
          71: { icon: "🌨️", desc: "약한 눈" },
          73: { icon: "🌨️", desc: "눈" },
          75: { icon: "🌨️", desc: "강한 눈" },
          80: { icon: "🌧️", desc: "소나기" },
          81: { icon: "🌧️", desc: "강한 소나기" },
          82: { icon: "🌧️", desc: "매우 강한 소나기" },
          95: { icon: "⛈️", desc: "뇌우" }
        };

        const weather = map[weatherCode] || { icon: "☀️", desc: "맑음" };

        document.getElementById("weatherTemp").textContent = `${temp}°`;
        document.getElementById("weatherDesc").textContent = weather.desc;
        document.getElementById("weatherIcon").textContent = weather.icon;
        document.getElementById("weatherHigh").textContent = `최고 ${max}°`;
        document.getElementById("weatherLow").textContent = `최저 ${min}°`;
        document.getElementById("weatherHumidity").textContent = `습도 ${humid}%`;
      } catch (e) {
        // 기본값 유지
      }
    }

    updateClock();
    loadWeather();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
